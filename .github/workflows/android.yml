
name: Build Moja Vaktija APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: unzip MojaVaktija-Android-prototip.zip

      - name: Fix Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("MojaVaktija/app/build.gradle.kts")
          s = p.read_text()
          marker = '    buildFeatures { compose = true }'

          fix = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """

          if "jvmTarget = \"17\"" not in s:
              if marker not in s:
                  raise SystemExit("Could not find buildFeatures marker")
              s = s.replace(marker, fix + marker)

          p.write_text(s)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p MojaVaktija assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: MojaVaktija-APK
          path: MojaVaktija/app/build/outputs/apk/debug/app-debug.apk
