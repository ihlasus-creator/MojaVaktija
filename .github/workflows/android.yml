
name: Build Moja Vaktija APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
      
       unzip -q -- *.zip

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p MojaVaktija assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: MojaVaktija-APK
          path: MojaVaktija/app/build/outputs/apk/debug/app-debug.apk
